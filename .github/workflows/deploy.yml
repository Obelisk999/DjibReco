name: Déploiement automatique – Vercel & Supabase

on:
  push:
    branches:
      - abdoulrazak
      - main
  pull_request:
    branches:
      - main

jobs:
  # ────────────────────────────────────────────
  # 1. Tests avant déploiement
  # ────────────────────────────────────────────
  test:
    name: Tests Django
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "True"
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: python manage.py test --verbosity=2

  # ────────────────────────────────────────────
  # 2. Migrations Supabase (PostgreSQL)
  # ────────────────────────────────────────────
  migrate:
    name: Migrations Supabase
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Appliquer les migrations
        run: python manage.py migrate --noinput

      - name: Collecter les fichiers statiques
        run: python manage.py collectstatic --noinput

  # ────────────────────────────────────────────
  # 3. Déploiement sur Vercel
  # ────────────────────────────────────────────
  deploy-vercel:
    name: Déploiement Vercel
    runs-on: ubuntu-latest
    needs: migrate
    if: github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer sur Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
          working-directory: .
